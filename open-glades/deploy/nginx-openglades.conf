# Open Glades — nginx server block (static site + mailer reverse-proxy)
#
# Serves the static site straight from the repo checkout and proxies only the
# contact endpoint to the local mailer service (see openglades-mailer.service).
#
# Adjust REPO_ROOT to wherever you `git clone` the jroverton.com repo on the server.
# The site lives at  <REPO_ROOT>/open-glades/site
#
# TLS: run `certbot --nginx -d openglades.com -d www.openglades.com` after this is
# enabled; certbot will rewrite/duplicate these blocks to add the 443 listener.

# --- redirect www -> apex (over http; certbot adds the https variants) ---
server {
    listen 80;
    listen [::]:80;
    server_name www.openglades.com;
    return 301 https://openglades.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name openglades.com;

    # >>> EDIT THIS PATH <<<
    root /srv/jroverton.com/open-glades/site;
    index index.html;

    # gzip text assets
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # contact form -> local mailer service
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # hashed/static assets — long cache
    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; expires 7d; try_files $uri =404; }

    # html / everything else — always revalidate so deploys show up immediately
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
