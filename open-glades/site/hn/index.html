<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>HN Reader</title>
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HN Reader">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  // Apply a saved theme before first paint so there is no flash.
  try {
    var t = localStorage.getItem('hn-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f1f1f1;
    --text: #0a0a0a;
    --muted: #3a3a3a;
    --border: #b9b9b9;
    --rule: #0a0a0a;
    --link: #0a3fb5;
    --visited: #5b2a91;
    --accent: #b83c00;
    --quote: #2d2d2d;
    --code-bg: #f1f1f1;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1114;
      --surface: #1a1d22;
      --text: #ededed;
      --muted: #b6bac2;
      --border: #3a3f48;
      --rule: #4a505b;
      --link: #8db8ff;
      --visited: #c7a8ff;
      --accent: #ff9248;
      --quote: #cfd3da;
      --code-bg: #1a1d22;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1114;
    --surface: #1a1d22;
    --text: #ededed;
    --muted: #b6bac2;
    --border: #3a3f48;
    --rule: #4a505b;
    --link: #8db8ff;
    --visited: #c7a8ff;
    --accent: #ff9248;
    --quote: #cfd3da;
    --code-bg: #1a1d22;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { font-size: 18pt; -webkit-text-size-adjust: 100%; }  /* base text size; every other size is in rem */
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow-wrap: break-word;
  }
  a { color: var(--link); text-underline-offset: 2px; }
  a:visited { color: var(--visited); }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 40rem; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  header.bar { padding-top: env(safe-area-inset-top); }

  header.bar {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    border-bottom: 2px solid var(--rule);
  }
  header.bar .wrap { display: flex; align-items: center; gap: 4px 14px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--text); text-decoration: none; }
  .brand:visited { color: var(--text); }
  .brand b { display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; background: var(--accent); color: var(--bg); font-size: 0.9rem; }
  nav { display: flex; flex-wrap: wrap; gap: 2px; flex: 1; }
  nav a { color: var(--text); text-decoration: none; font-weight: 600; padding: 4px 9px; border-radius: 4px; }
  nav a:visited { color: var(--text); }
  nav a:hover { background: var(--surface); }
  nav a[aria-current="page"] { background: var(--text); color: var(--bg); }
  button {
    font: inherit; font-size: 0.9rem; font-weight: 600; color: var(--text);
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 4px;
    padding: 4px 10px; cursor: pointer;
  }
  button:hover { background: var(--surface); }

  main { padding: 12px 0 64px; min-height: 70vh; }
  .status { padding: 32px 0; color: var(--muted); }
  .status button { margin-left: 8px; }

  /* story list */
  ol.stories { list-style: none; margin: 0; padding: 0; }
  .story { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .rank { flex: 0 0 2.2em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .story-main { min-width: 0; }
  .title { color: var(--text); font-weight: 650; font-size: 1.08rem; line-height: 1.35; text-decoration: none; }
  .title:hover { text-decoration: underline; }
  .title:visited { color: var(--visited); }
  .site { color: var(--muted); font-size: 0.88rem; margin-left: 6px; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 0.92rem; margin-top: 2px; }
  .meta a { color: var(--muted); font-weight: 600; }
  .meta a:visited { color: var(--muted); }
  .meta a:hover { color: var(--link); }
  .more { display: block; margin: 20px auto 0; padding: 8px 28px; font-size: 1rem; }

  /* item page */
  .item-head { padding: 8px 0 14px; border-bottom: 2px solid var(--rule); margin-bottom: 8px; }
  .item-head h1 { font-size: 1.5rem; line-height: 1.25; margin: 6px 0 4px; }
  .item-head h1 a { color: var(--text); text-decoration: none; }
  .item-head h1 a:hover { text-decoration: underline; }
  .item-text { margin-top: 12px; }

  .prose { max-width: 36rem; }
  .prose p { margin: 0.65em 0; }
  .prose p:first-child { margin-top: 0; }
  .prose p:last-child { margin-bottom: 0; }
  .prose p.quote { color: var(--quote); border-left: 3px solid var(--accent); padding-left: 10px; font-style: italic; }
  .prose pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; overflow-x: auto; font-size: 0.88rem; line-height: 1.45; }
  .prose code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* reader view: an article from another site, in our colours and type */
  .article { margin-top: 12px; }
  .article h2, .article h3, .article h4, .article h5, .article h6 { line-height: 1.3; margin: 1.5em 0 0.5em; }
  .article h2 { font-size: 1.3rem; }
  .article h3 { font-size: 1.15rem; }
  .article h4, .article h5, .article h6 { font-size: 1rem; }
  .article img { display: block; max-width: 100%; height: auto; margin: 1em 0; border-radius: 4px; }
  .article figure { margin: 1em 0; }
  .article figcaption { color: var(--muted); font-size: 0.85rem; }
  .article blockquote { margin: 1em 0; padding-left: 12px; border-left: 3px solid var(--accent); color: var(--quote); }
  .article ul, .article ol { padding-left: 1.4em; }
  .article li { margin: 0.3em 0; }
  .article table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; font-size: 0.85rem; }
  .article th, .article td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; vertical-align: top; }
  .article hr { border: 0; border-top: 1px solid var(--border); margin: 1.5em 0; }
  .article :not(pre) > code { background: var(--code-bg); padding: 1px 4px; border-radius: 3px; font-size: 0.9em; }
  .read-fail .btn { display: inline-block; margin-top: 8px; padding: 6px 14px; border: 1.5px solid var(--border); border-radius: 4px; color: var(--text); font-weight: 600; text-decoration: none; }

  .comment { padding-top: 14px; }
  .c-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 0.9rem; color: var(--muted); margin-bottom: 4px; }
  .c-toggle { width: 1.5rem; height: 1.5rem; padding: 0; line-height: 1; font-size: 1rem; flex: none; }
  .c-author { color: var(--text); font-weight: 700; }
  .c-op { background: var(--accent); color: var(--bg); font-size: 0.72rem; font-weight: 800; padding: 0 5px; border-radius: 3px; }
  .c-age { color: var(--muted); }
  .c-age:visited { color: var(--muted); }
  .c-kids { margin-left: 12px; padding-left: 14px; border-left: 2px solid var(--border); }
  .c-kids:empty { display: none; }
  .comment.collapsed > .c-body, .comment.collapsed > .c-kids { display: none; }
  .comments > .comment { border-bottom: 1px solid var(--border); padding-bottom: 14px; }

  footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 0.85rem; padding: 16px 0 32px; }
  footer a { color: var(--muted); }

  /* back / forward pill, only when running as an installed app (no browser buttons there) */
  .pwa-nav {
    display: none; position: fixed; z-index: 6;
    left: 50%; transform: translateX(-50%);
    bottom: calc(12px + env(safe-area-inset-bottom));
    gap: 4px; padding: 4px;
    background: var(--bg); border: 1.5px solid var(--rule); border-radius: 999px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
  }
  html.standalone .pwa-nav { display: flex; }
  html.standalone main { padding-bottom: calc(5rem + env(safe-area-inset-bottom)); }
  .pwa-nav button { display: grid; place-items: center; width: 3rem; height: 2.2rem; padding: 0; border: 0; border-radius: 999px; }
  .pwa-nav button:disabled { opacity: 0.3; cursor: default; background: none; }
  .pwa-nav svg { width: 1.2rem; height: 1.2rem; }

  @media (max-width: 600px) {
    header.bar .wrap { justify-content: space-between; }
    nav { order: 3; flex: 0 0 100%; justify-content: space-between; }
    nav a { padding: 2px 5px; font-size: 0.85rem; }
    .story { gap: 8px; }
    .rank { flex-basis: 1.7em; }
    .c-kids { margin-left: 4px; padding-left: 9px; }
    .item-head h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="#/top"><b>Y</b><span>HN Reader</span></a>
    <nav id="nav" aria-label="Feeds"></nav>
    <button id="theme" type="button" title="Switch colour theme"></button>
  </div>
</header>
<div class="wrap">
  <main id="main"></main>
  <footer>
    Unofficial reader for <a href="https://news.ycombinator.com/" rel="noopener noreferrer">Hacker News</a>.
    Read-only; data from the public HN and Algolia APIs.
  </footer>
</div>

<div class="pwa-nav" role="group" aria-label="History">
  <button id="nav-back" type="button" aria-label="Back" title="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button id="nav-fwd" type="button" aria-label="Forward" title="Forward">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</div>

<script>
(() => {
  'use strict';

  const FB = 'https://hacker-news.firebaseio.com/v0/';
  const ALGOLIA = 'https://hn.algolia.com/api/v1/items/';
  const HN_ITEM = 'https://news.ycombinator.com/item?id=';
  const FEEDS = {
    top: ['Top', 'topstories'], new: ['New', 'newstories'], best: ['Best', 'beststories'],
    ask: ['Ask', 'askstories'], show: ['Show', 'showstories'], jobs: ['Jobs', 'jobstories'],
  };
  const PAGE = 30;

  const main = document.getElementById('main');
  const nav = document.getElementById('nav');
  const itemCache = new Map();   // id -> Promise<item>
  const feedIds = new Map();     // feed -> [ids]
  const feedShown = new Map();   // feed -> how many rows were loaded
  const scrollPos = new Map();   // route key -> scrollY
  let token = 0;                 // guards against out-of-order renders
  let currentKey = null;
  let linkNav = false;           // true when navigation came from a click (vs back/forward)

  // ---------- keeping your place ----------
  // Scroll positions live in memory while you move around inside the reader. They are also
  // written to sessionStorage when the page is hidden, so coming Back from an article on
  // another site lands on the same story even if the browser had to reload the page.
  const STATE_KEY = 'hn-nav-state';
  function saveState() {
    if (currentKey) scrollPos.set(currentKey, window.scrollY);
    try {
      sessionStorage.setItem(STATE_KEY, JSON.stringify({ scroll: [...scrollPos], shown: [...feedShown], ids: [...feedIds] }));
    } catch (e) {}
  }
  function loadState() {
    try {
      // Only when arriving via Back/Forward: a fresh visit or a reload should start clean.
      const entry = performance.getEntriesByType('navigation')[0];
      if (!entry || entry.type !== 'back_forward') return;
      const s = JSON.parse(sessionStorage.getItem(STATE_KEY) || 'null');
      if (!s) return;
      for (const [k, v] of s.scroll || []) scrollPos.set(k, v);
      for (const [k, v] of s.shown || []) feedShown.set(k, v);
      for (const [k, v] of s.ids || []) feedIds.set(k, v);
    } catch (e) {}
  }
  window.addEventListener('pagehide', saveState);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveState(); });

  // ---------- helpers ----------
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const k in props || {}) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
    return el;
  }

  async function getJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  function fbItem(id) {
    if (!itemCache.has(id)) {
      itemCache.set(id, getJSON(FB + 'item/' + id + '.json').catch((e) => { itemCache.delete(id); throw e; }));
    }
    return itemCache.get(id);
  }

  function ago(sec) {
    const s = Math.max(0, Date.now() / 1000 - sec);
    const units = [[31536000, 'year'], [2592000, 'month'], [86400, 'day'], [3600, 'hour'], [60, 'minute']];
    for (const [n, name] of units) {
      if (s >= n) { const v = Math.floor(s / n); return v + ' ' + name + (v === 1 ? '' : 's') + ' ago'; }
    }
    return 'just now';
  }

  function domain(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
  }

  function safeUrl(url) { return /^https?:\/\//i.test(url || '') ? url : null; }

  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

  // Comment text and extracted articles are untrusted HTML. Rebuild them from an allowlist
  // of tags (no attributes survive except vetted link and image URLs) instead of trusting them.
  const COMMENT_TAGS = new Set(['P', 'I', 'EM', 'B', 'STRONG', 'PRE', 'CODE', 'A', 'BR']);
  const ARTICLE_TAGS = new Set([...COMMENT_TAGS, 'H2', 'H3', 'H4', 'H5', 'H6', 'UL', 'OL', 'LI', 'BLOCKQUOTE',
    'IMG', 'FIGURE', 'FIGCAPTION', 'HR', 'SUP', 'SUB', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TH', 'TD',
    'DL', 'DT', 'DD', 'S', 'DEL', 'U', 'SMALL', 'MARK', 'KBD']);
  const DROPPED = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'TEMPLATE', 'SVG', 'MATH', 'NOSCRIPT',
    'FORM', 'BUTTON', 'INPUT', 'SELECT', 'TEXTAREA', 'AUDIO', 'VIDEO', 'CANVAS', 'LINK', 'META', 'HEAD', 'TITLE']);
  function absUrl(value, base) {
    try {
      const u = base ? new URL(value, base) : new URL(value);
      return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : null;
    } catch (e) { return null; }
  }
  function copyClean(src, dst, allowed, base) {
    for (const n of src.childNodes) {
      if (n.nodeType === Node.TEXT_NODE) { dst.append(n.textContent); continue; }
      if (n.nodeType !== Node.ELEMENT_NODE) continue;
      let tag = n.tagName.toUpperCase();
      if (DROPPED.has(tag)) continue;
      if (tag === 'H1') tag = 'H2';   // the page already has its own h1
      let target = dst;
      if (allowed.has(tag)) {
        if (tag === 'IMG') {
          const src = absUrl(n.getAttribute('src') || '', base);
          if (src) dst.append(h('img', { src, alt: n.getAttribute('alt') || '', loading: 'lazy', decoding: 'async', referrerpolicy: 'no-referrer' }));
          continue;
        }
        target = document.createElement(tag);
        if (tag === 'A') {
          const href = absUrl(n.getAttribute('href') || '', base);
          if (href) {
            const m = href.match(/^https?:\/\/news\.ycombinator\.com\/item\?id=(\d+)/i);
            target.setAttribute('href', m ? '#/item/' + m[1] : href);
            if (!m) target.setAttribute('rel', 'noopener noreferrer nofollow');
          }
        }
        dst.append(target);
      }
      copyClean(n, target, allowed, base);
    }
  }
  function prose(html) {
    const box = h('div', { class: 'prose' });
    if (!html) return box;
    copyClean(new DOMParser().parseFromString(html, 'text/html').body, box, COMMENT_TAGS);
    // HN leaves the first paragraph bare; wrap it so every paragraph is a <p>.
    const lead = [];
    for (const n of box.childNodes) { if (n.nodeName === 'P' || n.nodeName === 'PRE') break; lead.push(n); }
    if (lead.length) { const p = h('p'); box.insertBefore(p, lead[0]); p.append(...lead); }
    for (const p of box.querySelectorAll('p')) {
      if (!p.textContent.trim() && !p.children.length) p.remove();
      else if (p.textContent.trimStart().startsWith('>')) p.classList.add('quote');
    }
    return box;
  }

  function articleBody(html, base) {
    const box = h('div', { class: 'prose article' });
    copyClean(new DOMParser().parseFromString(html, 'text/html').body, box, ARTICLE_TAGS, base);
    for (const el of box.querySelectorAll('p, li, figure, h2, h3, h4, h5, h6, blockquote')) {
      if (!el.textContent.trim() && !el.querySelector('img')) el.remove();
    }
    return box;
  }

  // ---------- which links open in the reader view ----------
  // Most story links are articles and open in the reader view. These are the exceptions that
  // open the original site as usual: things that are not articles, sites that refuse the
  // reader, and anything the reader has already failed on (remembered in localStorage).
  const SKIP_HOSTS = [
    // social, video, audio, app stores, documents
    'twitter.com', 'x.com', 'bsky.app', 'threads.net', 'instagram.com', 'facebook.com', 'tiktok.com', 'linkedin.com',
    'reddit.com', 'youtube.com', 'youtu.be', 'vimeo.com', 'twitch.tv', 'open.spotify.com', 'soundcloud.com',
    'apps.apple.com', 'play.google.com', 'docs.google.com', 'drive.google.com', 'news.ycombinator.com',
    // sites that turn the reader away (login walls or automated-request blocks)
    'nytimes.com', 'wsj.com', 'ft.com', 'economist.com', 'reuters.com', 'bloomberg.com', 'apnews.com',
    'theguardian.com', 'medium.com', 'phoronix.com', 'upi.com', 'smithsonianmag.com', 'dl.acm.org',
  ];
  const SKIP_EXT = /\.(pdf|png|jpe?g|gif|webp|avif|svg|mp4|webm|mov|mp3|wav|ogg|flac|zip|gz|tgz|tar|7z|dmg|exe|apk|iso|csv|json|xml|epub|pptx?|docx?|xlsx?)$/i;
  const SKIP_TITLE = /\[(pdf|video|audio|slides)\]/i;
  const GITHUB_SKIP = /^\/[^/]+\/[^/]+\/(issues|pulls?|discussions|commits?|compare|actions|releases|tags|wiki)(\/|$)/;
  const SKIP_KEY = 'hn-reader-skip';
  const HOST_MEMORY_MS = 7 * 86400 * 1000;
  let skipMemo = { hosts: {}, ids: [] };
  try {
    const saved = JSON.parse(localStorage.getItem(SKIP_KEY) || 'null');
    if (saved && saved.hosts && Array.isArray(saved.ids)) skipMemo = saved;
  } catch (e) {}

  function hostMatches(host, name) { return host === name || host.endsWith('.' + name); }
  function opensInReader(id, rawUrl, title) {
    const url = safeUrl(rawUrl);
    if (!url) return false;
    let u;
    try { u = new URL(url); } catch (e) { return false; }
    const host = u.hostname.replace(/^www\./, '');
    if (SKIP_HOSTS.some((name) => hostMatches(host, name))) return false;
    if (SKIP_EXT.test(u.pathname) || SKIP_TITLE.test(title || '')) return false;
    if (host === 'github.com' && GITHUB_SKIP.test(u.pathname)) return false;
    if (skipMemo.ids.includes(id)) return false;
    const learned = skipMemo.hosts[host];
    if (learned && Date.now() - learned < HOST_MEMORY_MS) return false;
    return true;
  }
  // Called when the reader fails. A refusal is the site's doing, so skip the whole site for a
  // week; anything else definite is about that one page. Temporary trouble is not remembered.
  function rememberFailure(id, rawUrl, code) {
    if (code === 'upstream_401' || code === 'upstream_403') {
      skipMemo.hosts[domain(rawUrl)] = Date.now();
    } else if (['no_article', 'not_html', 'no_url', 'too_large', 'upstream_404', 'upstream_410', 'blocked_address', 'bad_url'].includes(code)) {
      if (!skipMemo.ids.includes(id)) skipMemo.ids.push(id);
      if (skipMemo.ids.length > 400) skipMemo.ids.splice(0, skipMemo.ids.length - 400);
    } else {
      return;
    }
    for (const host in skipMemo.hosts) if (Date.now() - skipMemo.hosts[host] > HOST_MEMORY_MS) delete skipMemo.hosts[host];
    try { localStorage.setItem(SKIP_KEY, JSON.stringify(skipMemo)); } catch (e) {}
  }

  function status(msg, retry) {
    return h('p', { class: 'status', role: 'status' }, msg,
      retry && h('button', { type: 'button', onclick: retry }, 'Retry'));
  }

  // ---------- feeds ----------
  function storyRow(it, rank) {
    const url = safeUrl(it.url);
    const self = '#/item/' + it.id;
    const meta = [];
    if (it.score != null && it.type !== 'job') meta.push(plural(it.score, 'point'));
    if (it.by && it.type !== 'job') meta.push('by ' + it.by);
    meta.push(ago(it.time));
    const metaEl = h('div', { class: 'meta' }, meta.join(' · '));
    if (it.type !== 'job') {
      metaEl.append(' · ', h('a', { href: self }, it.descendants ? plural(it.descendants, 'comment') : 'discuss'));
    }
    const reader = opensInReader(it.id, it.url, it.title);
    if (reader) metaEl.append(' · ', h('a', { href: url, rel: 'noopener noreferrer', title: 'Open the original site' }, 'original'));
    return h('li', { class: 'story' },
      h('span', { class: 'rank' }, rank + '.'),
      h('div', { class: 'story-main' },
        h('a', { class: 'title', href: reader ? '#/read/' + it.id : (url || self), rel: url && !reader && 'noopener noreferrer' }, it.title || '(untitled)'),
        url && h('span', { class: 'site', title: reader ? 'Opens in the reader view' : 'Opens the original site' }, '(' + domain(url) + (reader ? '' : ' \u2197') + ')'),
        metaEl));
  }

  async function renderFeed(feed, tok) {
    document.title = FEEDS[feed][0] + ' · HN Reader';
    main.replaceChildren(status('Loading stories…'));
    if (!feedIds.has(feed)) feedIds.set(feed, await getJSON(FB + FEEDS[feed][1] + '.json') || []);
    if (tok !== token) return;
    const ids = feedIds.get(feed);
    const list = h('ol', { class: 'stories' });
    const more = h('button', { class: 'more', type: 'button' }, 'More');
    let shown = 0;

    async function add(n) {
      more.disabled = true; more.textContent = 'Loading…';
      const start = shown;
      const slice = ids.slice(start, start + n);
      const items = await Promise.all(slice.map((id) => fbItem(id).catch(() => null)));
      if (tok !== token) return;
      items.forEach((it, i) => { if (it && !it.dead && !it.deleted) list.append(storyRow(it, start + i + 1)); });
      shown = start + slice.length;
      feedShown.set(feed, shown);
      more.disabled = false; more.textContent = 'More';
      more.hidden = shown >= ids.length;
    }
    more.addEventListener('click', () => add(PAGE));

    await add(Math.max(PAGE, feedShown.get(feed) || 0));
    if (tok !== token) return;
    if (!list.children.length) main.replaceChildren(status('Nothing here right now.'));
    else main.replaceChildren(list, more);
  }

  // ---------- item + comments ----------
  function fromAlgolia(n) {
    return {
      id: n.id, author: n.author, text: n.text, time: n.created_at_i,
      children: (n.children || []).map(fromAlgolia),
    };
  }
  async function fromFirebase(it) {
    const kids = await Promise.all((it.kids || []).map((id) => fbItem(id).then((k) => k && fromFirebase(k)).catch(() => null)));
    const gone = it.deleted || it.dead;
    return { id: it.id, author: gone ? null : it.by, text: gone ? null : it.text, time: it.time, children: kids.filter(Boolean) };
  }
  function prune(node) {
    node.children = node.children.map(prune).filter(Boolean);
    return (node.text || node.children.length) ? node : null;
  }
  function countAll(node) { return node.children.reduce((n, c) => n + 1 + countAll(c), 0); }

  async function loadThread(id) {
    // Firebase has live scores and HN's own ranking of the top-level comments;
    // Algolia returns the whole tree in one request. Use both, fall back to Firebase alone.
    const fbP = getJSON(FB + 'item/' + id + '.json').catch(() => null);
    let tree;
    try {
      tree = fromAlgolia(await getJSON(ALGOLIA + id));
    } catch (e) {
      const fb = await fbP;
      if (!fb) throw new Error('Item not found');
      tree = await fromFirebase(fb);
    }
    const fb = await fbP;
    if (fb && fb.kids) {
      const order = new Map(fb.kids.map((k, i) => [k, i]));
      const pos = (c) => (order.has(c.id) ? order.get(c.id) : Infinity);
      tree.children.sort((a, b) => pos(a) - pos(b));
    }
    tree.children = tree.children.map(prune).filter(Boolean);
    return { tree, fb: fb || {} };
  }

  function commentEl(c, op) {
    const hidden = countAll(c) + 1;
    const note = h('span', { class: 'c-note' });
    const toggle = h('button', { class: 'c-toggle', type: 'button', 'aria-expanded': 'true', 'aria-label': 'Collapse thread' }, '−');
    const el = h('div', { class: 'comment', id: 'c' + c.id },
      h('div', { class: 'c-head' },
        toggle,
        h('span', { class: 'c-author' }, c.author || '[deleted]'),
        c.author && c.author === op && h('span', { class: 'c-op', title: 'Original poster' }, 'OP'),
        h('a', { class: 'c-age', href: HN_ITEM + c.id, rel: 'noopener noreferrer', title: 'Open on Hacker News' }, ago(c.time)),
        note),
      c.text ? Object.assign(prose(c.text), { className: 'prose c-body' }) : h('div', { class: 'prose c-body' }, h('p', null, '[deleted]')),
      h('div', { class: 'c-kids' }, c.children.map((k) => commentEl(k, op))));
    toggle.addEventListener('click', () => {
      const collapsed = el.classList.toggle('collapsed');
      toggle.textContent = collapsed ? '+' : '−';
      toggle.setAttribute('aria-expanded', String(!collapsed));
      toggle.setAttribute('aria-label', collapsed ? 'Expand thread' : 'Collapse thread');
      note.textContent = collapsed ? '(' + plural(hidden, 'comment') + ' hidden)' : '';
    });
    return el;
  }

  async function renderItem(id, tok) {
    document.title = 'HN Reader';
    main.replaceChildren(status('Loading discussion…'));
    const { tree, fb } = await loadThread(id);
    if (tok !== token) return;

    const url = safeUrl(fb.url);
    const reader = opensInReader(id, fb.url, fb.title);
    const isComment = fb.type === 'comment' || (!fb.title && fb.parent);
    const title = fb.title || (isComment ? 'Comment by ' + (tree.author || fb.by || 'unknown') : '(untitled)');
    document.title = title + ' · HN Reader';
    const total = countAll(tree);

    const meta = [];
    if (fb.score != null && fb.type !== 'job') meta.push(plural(fb.score, 'point'));
    const by = fb.by || tree.author;
    if (by) meta.push('by ' + by);
    if (tree.time || fb.time) meta.push(ago(tree.time || fb.time));
    if (fb.type !== 'job') meta.push(plural(total, 'comment'));
    const metaEl = h('div', { class: 'meta' }, meta.join(' · '), ' · ',
      h('a', { href: HN_ITEM + id, rel: 'noopener noreferrer' }, 'view on HN'));
    if (reader) metaEl.append(' · ', h('a', { href: url, rel: 'noopener noreferrer', title: 'Open the original site' }, 'original'));
    if (isComment && fb.parent) metaEl.append(' · ', h('a', { href: '#/item/' + fb.parent }, 'parent'));

    const head = h('div', { class: 'item-head' },
      h('h1', null, url ? h('a', { href: reader ? '#/read/' + id : url, rel: !reader && 'noopener noreferrer' }, title) : title),
      url && h('div', { class: 'meta' }, domain(url) + (reader ? '' : ' \u2197')),
      metaEl,
      (tree.text || fb.text) && Object.assign(prose(tree.text || fb.text), { className: 'prose item-text' }));

    const comments = h('div', { class: 'comments' }, tree.children.map((c) => commentEl(c, by)));
    main.replaceChildren(head, comments);
    if (!tree.children.length && fb.type !== 'job') main.append(status('No comments yet.'));
  }

  // ---------- reader view ----------
  const articleCache = new Map();   // id -> Promise<article>
  const READ_ERRORS = {
    no_article: 'There was no article text to pull out of this page. It may be a video, an app, or a page that needs JavaScript.',
    not_html: 'This link is not a web page (it may be a PDF, image or video).',
    no_url: 'This story has no outside link to read.',
    too_large: 'This page is too large to convert.',
    timeout: 'The site took too long to answer.',
    rate_limited: 'Too many articles requested at once. Give it a minute.',
    busy: 'The reader is busy right now. Try again in a moment.',
    upstream_401: 'The site wants a login for this page.',
    upstream_403: 'The site refused to hand this page to the reader.',
    upstream_404: 'The site says this page no longer exists.',
    upstream_429: 'The site is rate limiting requests right now.',
  };
  function getArticle(id) {
    if (!articleCache.has(id)) {
      const p = fetch('api/read?id=' + id).then(async (r) => {
        const data = await r.json().catch(() => null);
        if (!r.ok || !data || data.error) throw new Error((data && data.error) || 'unavailable');
        return data;
      });
      p.catch(() => articleCache.delete(id));
      articleCache.set(id, p);
    }
    return articleCache.get(id);
  }

  async function renderRead(id, tok, fresh) {
    document.title = 'HN Reader';
    main.replaceChildren(status('Fetching article…'));
    const story = '#/item/' + id;
    let art;
    try {
      art = await getArticle(id);
    } catch (e) {
      const it = await fbItem(id).catch(() => null);
      if (tok !== token) return;
      const orig = it && safeUrl(it.url);
      if (orig) rememberFailure(id, orig, e.message);
      // Fall back to how the link normally works: go to the site itself. Only on a fresh tap,
      // so coming Back to this page never bounces you out again.
      const forward = orig && fresh;
      main.replaceChildren(h('div', { class: 'item-head read-fail' },
        h('h1', null, (it && it.title) || 'Article'),
        h('p', null, READ_ERRORS[e.message] || 'The reader could not load this article.'),
        forward && h('p', { class: 'meta' }, 'Opening the original site instead…'),
        orig && h('a', { class: 'btn', href: orig, rel: 'noopener noreferrer' }, 'Open the original site'), ' ',
        h('a', { class: 'btn', href: story }, 'Comments')));
      if (forward) location.replace(orig);
      return;
    }
    if (tok !== token) return;
    document.title = (art.title || 'Article') + ' · HN Reader';
    const meta = [domain(art.url)];
    if (art.byline) meta.push(art.byline);
    if (art.words) meta.push(Math.max(1, Math.round(art.words / 230)) + ' min read');
    main.replaceChildren(
      h('div', { class: 'item-head' },
        h('h1', null, art.title || 'Article'),
        h('div', { class: 'meta' }, meta.filter(Boolean).join(' · ')),
        h('div', { class: 'meta' },
          h('a', { href: art.url, rel: 'noopener noreferrer' }, 'original site'), ' · ',
          h('a', { href: story }, 'comments'))),
      articleBody(art.content, art.url));
  }

  // ---------- routing ----------
  function parseRoute() {
    const parts = location.hash.replace(/^#\/?/, '').split('/');
    if ((parts[0] === 'item' || parts[0] === 'read') && /^\d+$/.test(parts[1] || '')) {
      return { view: parts[0], id: Number(parts[1]), key: parts[0] + '/' + parts[1] };
    }
    const feed = FEEDS[parts[0]] ? parts[0] : 'top';
    return { view: 'feed', feed, key: feed };
  }

  async function route() {
    if (currentKey) scrollPos.set(currentKey, window.scrollY);
    const r = parseRoute();
    const fresh = linkNav;
    const restore = fresh ? 0 : (scrollPos.get(r.key) || 0);
    linkNav = false;
    currentKey = r.key;
    const tok = ++token;
    for (const a of nav.children) {
      if (r.view === 'feed' && a.dataset.feed === r.feed) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    }
    window.scrollTo(0, 0);
    try {
      if (r.view === 'item') await renderItem(r.id, tok);
      else if (r.view === 'read') await renderRead(r.id, tok, fresh);
      else await renderFeed(r.feed, tok);
      if (tok === token) window.scrollTo(0, restore);
    } catch (e) {
      if (tok !== token) return;
      main.replaceChildren(status('Could not load this page (' + e.message + ').', () => { feedIds.delete(r.feed); route(); }));
    }
  }

  for (const key in FEEDS) nav.append(h('a', { href: '#/' + key, 'data-feed': key }, FEEDS[key][0]));

  document.addEventListener('click', (e) => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const a = e.target.closest && e.target.closest('a[href^="#/"]');
    if (!a) return;
    linkNav = true;
    // Clicking the feed you are already on refreshes it.
    const target = a.getAttribute('href');
    if (target === location.hash || (target === '#/top' && !location.hash)) {
      const r = parseRoute();
      if (r.view === 'feed') { feedIds.delete(r.feed); feedShown.delete(r.feed); itemCache.clear(); }
      e.preventDefault();
      route();
    }
  });

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.addEventListener('hashchange', route);

  // ---------- theme ----------
  const themeBtn = document.getElementById('theme');
  const THEMES = ['auto', 'light', 'dark'];
  function currentTheme() { return document.documentElement.dataset.theme || 'auto'; }
  function paintTheme() {
    themeBtn.textContent = { auto: 'Auto', light: 'Light', dark: 'Dark' }[currentTheme()] + ' theme';
    // Keep the browser / installed-app chrome the same colour as the page.
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme);
  themeBtn.addEventListener('click', () => {
    const next = THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length];
    if (next === 'auto') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = next;
    try { next === 'auto' ? localStorage.removeItem('hn-theme') : localStorage.setItem('hn-theme', next); } catch (e) {}
    paintTheme();
  });
  paintTheme();
  loadState();

  // ---------- installed-app back / forward ----------
  const standaloneMq = matchMedia('(display-mode: standalone)');
  const backBtn = document.getElementById('nav-back');
  const fwdBtn = document.getElementById('nav-fwd');
  function paintStandalone() {
    document.documentElement.classList.toggle('standalone', standaloneMq.matches || navigator.standalone === true);
  }
  function paintHistory() {
    // The Navigation API knows whether there is anywhere to go; without it, leave both enabled.
    if (!window.navigation) return;
    backBtn.disabled = !navigation.canGoBack;
    fwdBtn.disabled = !navigation.canGoForward;
  }
  backBtn.addEventListener('click', () => history.back());
  fwdBtn.addEventListener('click', () => history.forward());
  standaloneMq.addEventListener('change', paintStandalone);
  if (window.navigation) navigation.addEventListener('currententrychange', paintHistory);
  paintStandalone();
  paintHistory();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  route();
})();
</script>
</body>
</html>
