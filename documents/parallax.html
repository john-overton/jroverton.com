<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallax Arc</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1d23;
    --paper: #f4f3f0;
    --accent: #2a6b5a;
    --accent-light: #3d8b76;
    --slate: #6b6e76;
    --slate-light: #9b9da3;
    --border-md: rgba(26, 29, 35, 0.12);
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
  }

  .page {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .hero {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 56px;
    align-items: center;
    gap: 64px;
    width: 100%;
  }

  .hero-text { max-width: 480px; }

  .hero-text h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 56px;
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -0.03em;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .hero-text .tagline {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    font-weight: 400;
    line-height: 1.3;
    color: var(--slate);
    margin-bottom: 20px;
  }

  .hero-text .tagline em {
    font-style: italic;
    color: var(--accent);
  }

  .hero-text p {
    font-size: 16px;
    line-height: 1.65;
    color: var(--slate);
    margin-bottom: 32px;
    max-width: 420px;
  }

  .session-inline {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    margin-bottom: 16px;
  }

  .session-inline .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
  }

  .session-inline .field label {
    font-size: 11px;
    font-weight: 500;
    color: var(--slate-light);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .session-inline .field input {
    padding: 12px 14px;
    border: 1.5px solid var(--border-md);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--white);
    outline: none;
    transition: border-color 0.2s;
  }

  .session-inline .field input:focus { border-color: var(--accent); }
  .session-inline .field input::placeholder { color: var(--slate-light); }

  .btn-go {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--accent);
    color: var(--white);
    padding: 12px 24px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    height: 46px;
  }

  .btn-go:hover { background: var(--accent-light); }
  .btn-go svg { width: 15px; height: 15px; }

  .session-return {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
    color: var(--slate-light);
  }

  .session-return a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }

  .session-return a:hover { text-decoration: underline; }

  .footer-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 56px;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
  }

  .footer-strip span {
    font-size: 12px;
    color: var(--slate-light);
  }

  .footer-links {
    display: flex;
    gap: 20px;
  }

  .footer-links a {
    font-size: 12px;
    color: var(--slate-light);
    text-decoration: none;
    transition: color 0.2s;
  }

  .footer-links a:hover { color: var(--slate); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero-text { animation: fadeUp 0.5s ease-out; }
</style>
</head>
<body>
<div class="page">
  <section class="hero">
    <div class="hero-text">
      <h1>Parallax Arc</h1>
      <div class="tagline">See your operation from <em>every angle</em></div>
      <p>Import route data, analyze demand patterns, measure deadhead and slack, and build optimized bids from real operational numbers.</p>
      
      <div class="session-inline">
        <div class="field">
          <label>Session Name</label>
          <input type="text" placeholder="Untitled Route Cut" />
        </div>
        <div class="field" style="max-width: 160px;">
          <label>Password</label>
          <input type="password" placeholder="Optional" />
        </div>
        <button class="btn-go">
          Go
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>

      <div class="session-return">
        Have a token? <a href="#">Return to session →</a>
      </div>
    </div>

    <div></div>
  </section>

  <div class="footer-strip">
    <span>&copy; 2026 John Overton</span>
    <div class="footer-links">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Contact</a>
    </div>
  </div>
</div>
</body>
</html>
